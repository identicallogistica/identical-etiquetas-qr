<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><meta name="theme-color" content="#092c47">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<title>Sistema Logístico · Identical</title>
<link rel="icon" href="./identical.jpg"><link rel="stylesheet" href="./portal.css"><link rel="stylesheet" href="./modulos.css">
<script type="module" src="./portal.js?v=20261126-qr8"></script>
</head>
<body>
<main id="login" class="login">
  <div class="franja" aria-hidden="true"></div>
  <section class="login-card" aria-labelledby="titulo-login">
    <img class="brand-login" src="./identical.jpg" alt="Clínica Dental Identical" width="170" height="82">
    <div class="login-intro"><h1 id="titulo-login">Sistema Logístico</h1><p>Ingresa a tu cuenta de Logística.</p></div>
    <form id="login-form">
      <label for="email">Correo electrónico</label>
      <div class="field"><span data-icon="mail" aria-hidden="true"></span><input id="email" name="email" type="email" autocomplete="username" placeholder="nombre@correo.com" required></div>
      <label for="password">Contraseña</label>
      <div class="field"><span data-icon="lock" aria-hidden="true"></span><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required><button type="button" id="reveal" class="plain" aria-label="Mostrar contraseña" aria-pressed="false"><span data-icon="eye"></span></button></div>
      <p id="login-message" class="feedback" role="status" aria-live="polite"></p>
      <button type="submit" id="enter" class="enter"><span>Iniciar sesión</span><span data-icon="arrow"></span></button>
    </form>
  </section>
</main>
<div id="app" hidden>
  <header class="header">
    <div class="header-inner">
      <button type="button" id="home-brand" class="brand-bar" aria-label="Ir a módulos"><img src="./identical.jpg" alt="Identical"><span>Logística</span></button>
      <div class="header-tools"><span id="user-email"></span><button type="button" id="logout" class="outline"><span data-icon="exit"></span>Cerrar sesión</button></div>
    </div>
    <nav id="nav" aria-label="Navegación principal"><div><button data-go="home">Módulos</button><button data-go="kardex">Kardex</button><button data-go="maestra">Data Maestra</button><button data-go="qr">Etiquetas QR</button></div></nav>
  </header>
  <main id="content" class="content" tabindex="-1"></main>
  <footer class="footer"><span>Clínica Dental Identical</span><span>Sistema Logístico</span></footer>
</div>
<noscript>Activa JavaScript en el navegador para ingresar al sistema logístico.</noscript>
</body></html>
