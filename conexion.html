<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Identical · Comprobar conexión</title><style>body{font:16px system-ui,sans-serif;color:#123359;background:#eef5fb;margin:0;padding:24px}main{max-width:900px;margin:auto;background:#fff;border-radius:20px;padding:24px}h1{font-size:26px;margin-top:0}button,input,textarea{font:inherit;box-sizing:border-box}button{border:0;border-radius:12px;background:#123359;color:#fff;padding:14px;cursor:pointer}button:disabled{opacity:.6}label{display:block;margin:16px 0}input,textarea{width:100%;border:1px solid #b9cddd;border-radius:10px;padding:12px;margin-top:6px}textarea{min-height:160px;font:13px monospace}.actions{display:flex;flex-wrap:wrap;gap:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f8fc;border-radius:12px;padding:16px;min-height:50px}.note{color:#506879;line-height:1.5}a{color:#123359}</style></head><body><main><h1>Comprobar conexión de Identical</h1><p class="note">Verificación de catálogo, stock y recibos ya registrados. Las reconfirmaciones conservan el mismo ID y no crean movimientos.</p><div class="actions"><button id="catalogTest">Leer PRODUCTOS</button><button id="getTest">Estado por GET</button><button id="postTest">Estado por POST</button></div><label>Código para consultar stock<input id="code" value="110000179" maxlength="120"></label><button id="stockTest">Consultar stock</button><label>Recibos existentes preparados para verificación<textarea id="existing" spellcheck="false" placeholder="Pega aquí el paquete de comprobación de recibos existentes"></textarea></label><button id="confirmTest">Reconfirmar recibos existentes</button><pre id="result" role="status" aria-live="polite"></pre><p><a href="./">Volver a Identical</a></p></main><script>
const INVENTORY='https://script.google.com/macros/s/AKfycbwI9V7Ahh3y_fFndJex9BXaszM3mWdNIm4GQwmaFQyhJlmOehzunaiirWsCzHWQnOF9/exec';
const CATALOG='https://script.google.com/macros/s/AKfycbzIYnkdzEyQEwhLGwIGZpE9cZVha9qqPvxpjnVz_6NBnhCT4yIiXHkavJlPWh5yXP79kA/exec';
const output=document.getElementById('result');
async function run(work){for(const button of document.querySelectorAll('button'))button.disabled=true;output.textContent='Comprobando…';const started=Date.now();try{const result=await work();output.textContent=JSON.stringify({ok:true,milliseconds:Date.now()-started,...result},null,2);}catch(error){output.textContent=JSON.stringify({ok:false,milliseconds:Date.now()-started,error:String(error.message||error)},null,2);}finally{for(const button of document.querySelectorAll('button'))button.disabled=false;}}
async function request(method,data={},get=false){const requestId=crypto.randomUUID(),controller=new AbortController(),timer=setTimeout(()=>controller.abort(),150000);try{const url=new URL(INVENTORY);let options={mode:'cors',credentials:'omit',cache:'no-store',redirect:'follow',signal:controller.signal};if(get){url.searchParams.set('api','1');url.searchParams.set('requestId',requestId);url.searchParams.set('method',method);if(data.code)url.searchParams.set('code',data.code);}else options={...options,method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({protocol:1,requestId,method,data})};const response=await fetch(url,options);if(!response.ok)throw Error('Respuesta HTTP '+response.status);let reply;try{reply=await response.json();}catch(error){throw Error('Google no devolvió JSON.');}if(reply.requestId!==requestId||reply.protocol!==1||reply.db!=='production')throw Error('Respuesta de conexión inválida.');if(!reply.ok)throw Error(reply.error||'Solicitud no confirmada.');if(reply.method!==method||!reply.result||!reply.result.ok)throw Error('Respuesta incompleta.');return reply.result;}finally{clearTimeout(timer);}}
document.getElementById('catalogTest').onclick=()=>run(async()=>{const response=await fetch(CATALOG+'?catalog=automatic&_='+Date.now(),{credentials:'omit',cache:'no-store',mode:'cors',redirect:'follow'});const result=await response.json();if(!result.ok||result.source!=='PRODUCTOS')throw Error(result.message||'No se confirmó PRODUCTOS.');return {test:'catalog',source:result.source,count:result.count,revision:result.revision,example:result.products?.find(p=>p.code==='110000179')};});
document.getElementById('getTest').onclick=()=>run(async()=>({test:'status-get',response:await request('status',{},true)}));
document.getElementById('postTest').onclick=()=>run(async()=>({test:'status-post',response:await request('status')}));
document.getElementById('stockTest').onclick=()=>run(async()=>{const result=await request('stock',{code:document.getElementById('code').value.trim()});return {test:'stock-post',code:result.code,warehouses:result.warehouses,lots:result.lots,asOf:result.asOf};});
document.getElementById('confirmTest').onclick=()=>run(async()=>{const entries=JSON.parse(document.getElementById('existing').value);if(!Array.isArray(entries)||!entries.length||entries.length>2)throw Error('Se necesitan uno o dos recibos existentes.');const results=[];for(const entry of entries){const m=entry.movement;if(!m||!m.operationId||!entry.expectedMovementId)throw Error('Paquete de verificación inválido.');const check=await request('operations',{operations:[m.operationId]});const known=check.operations&&check.operations.find(p=>p.operationId===m.operationId);if(!known||!known.found||known.result.movementId!==entry.expectedMovementId)throw Error('El recibo no existe o cambió. No se envió el movimiento.');const result=await request('reconfirm',{movement:m});if(!result.repeated||result.operationId!==m.operationId||result.movementId!==entry.expectedMovementId||!['synced','source_modified'].includes(result.kardex))throw Error('No se confirmó el recibo existente.');results.push({operationId:result.operationId,movementId:result.movementId,mode:result.mode,repeated:result.repeated,kardex:result.kardex,source:result.source,sourceRow:result.sourceRow});}return {test:'existing-receipts-post',results,createdMovements:0};});
</script></body></html>
